plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gdhub.loader'
    compileSdk 35

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    defaultConfig {
        applicationId 'com.gdhub.loader'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2.0-alpha'
        def publishApi = (project.findProperty('gdhubPublishApi') ?: '').toString()
        buildConfigField 'String', 'GDHUB_PUBLISH_API', "\"${publishApi}\""
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', '-DBUILD_TESTING=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
}


dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
}
