plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gdhub.loader'
    compileSdk 35

    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.gdhub.loader'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.2.0-alpha'
        buildConfigField 'String', 'GDHUB_PUBLISH_API', '\"\"'
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_shared', '-DBUILD_TESTING=OFF'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }
}
